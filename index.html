<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Breadcrumbs Timeline</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles/global.css">
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
</head>
<body>
    <div class="header-container">
        <img class="header-image" src="./header.png" alt="Breadcrumbs Timeline Header">
    </div>

    <div id="auth-container" class="auth-panel" style="display: none;">
        <div style="text-align: center; margin-bottom: 20px;">
            <h2 style="font-size: 20px;">Breadcrumbs Timeline</h2>
            <p style="font-size: 12px; color: #666;">Sign in to sync your data</p>
        </div>
        
        <button class="mac-button mac-button-primary" id="btn-signin-google" style="width: 100%; margin-bottom: 12px; font-size: 16px;">
            🔐 Sign in with Google
        </button>
        
        <button class="mac-button" id="btn-signin-email" style="width: 100%; margin-bottom: 12px; font-size: 14px;">
            📧 Sign in with Email
        </button>
        
        <div style="text-align: center; margin-top: 16px; font-size: 11px; color: #666;">
            Or continue without account
            <br>
            <span style="font-size: 10px;">(data saved locally only)</span>
            <br>
            <button class="mac-button" id="btn-continue-offline" style="margin-top: 8px; font-size: 11px;">Continue Offline</button>
        </div>
    </div>

    <div class="container" id="main-app">
        
        <div class="mac-window">
            <div class="mac-title-bar">
                <div class="title-left">
                    <span>Breadcrumbs Timeline</span>
                    <button class="sync-button" id="btn-sync" title="Refresh & Sync">🔄</button>
                </div>
                <div class="user-avatar" id="btn-user-avatar" style="display: none;">
                    <span id="user-icon">👤</span>
                    <div class="logout-menu" id="logout-menu">
                        <div class="user-email-display" id="user-email-full"></div>
                        <button id="btn-signout">🚪 Sign Out</button>
                    </div>
                </div>
            </div>
            <div class="mac-content">
                <button class="mac-button mac-button-primary" id="btn-toggle-crumb">➕ Crumb</button>
                <button class="mac-button" id="btn-toggle-timer">⏱️ Time</button>
                <button class="mac-button" id="btn-toggle-track">📊 Track</button>
                <button class="mac-button" id="btn-toggle-spent">💰 Spent</button>
            </div>
        </div>

        <div id="timeline-container">
            </div>

        <div class="mac-window hidden" id="empty-state">
            <div class="mac-content empty-state">
                <div style="font-size: 48px; margin-bottom: 16px;">📍</div>
                <p><strong>No entries yet</strong></p>
                <p style="color: #666; margin-top: 8px;">Create your first breadcrumb</p>
            </div>
        </div>
    </div>

    <div class="footer" id="footer" style="display: none;">
        <button class="mac-button" id="btn-open-stats">📊 Stats</button>
        <button class="mac-button" id="btn-export-csv">💾 CSV</button>
        <button class="mac-button" id="btn-export-ics">📅 iCal</button>
        <button class="mac-button" id="btn-open-settings">⚙️ Settings</button>
    </div>

    <div class="fab-container">
        <button class="fab fab-main" id="fab-main">
            <span id="fab-icon">+</span>
        </button>
        <div class="fab-action-wrapper hidden">
            <span class="fab-label">Breadcrumb</span>
            <button class="fab fab-action" id="fab-action-crumb" title="Breadcrumb">📍</button>
        </div>
        <div class="fab-action-wrapper hidden">
             <span class="fab-label">Time Event</span>
            <button class="fab fab-action" id="fab-action-time" title="Time Event">⏰</button>
        </div>
        <div class="fab-action-wrapper hidden">
             <span class="fab-label">Quick Track</span>
            <button class="fab fab-action" id="fab-action-track" title="Quick Track">📊</button>
        </div>
        <div class="fab-action-wrapper hidden">
             <span class="fab-label">Spent</span>
            <button class="fab fab-action" id="fab-action-spent" title="Spent">💰</button>
        </div>
         <div class="fab-action-wrapper hidden">
             <span class="fab-label">Day Recap</span>
            <button class="fab fab-action" id="fab-action-recap" title="Day Recap">🌟</button>
        </div>
    </div>

    
    <div id="recap-modal" class="preview-modal form-modal">...</div>
    <div id="crumb-modal" class="preview-modal form-modal">...</div>
    <div id="timer-modal" class="preview-modal form-modal">...</div>
    <div id="track-modal" class="preview-modal form-modal">...</div>
    <div id="spent-modal" class="preview-modal form-modal">...</div>
    <div id="preview-modal" class="preview-modal">...</div>
    <div id="settings-modal" class="preview-modal">...</div>
    <div id="stats-modal" class="preview-modal">...</div>
    <div id="export-modal" class="preview-modal">...</div>

    <script type="module" src="core/app.js"></script>

</body>
</html>
